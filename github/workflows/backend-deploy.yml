name: Backend Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name nidaw-staging --region ${{ secrets.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install nidaw-backend ./helm/nidaw \
            --namespace staging \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set global.environment=staging \
            --values ./helm/nidaw/values-staging.yaml \
            --wait \
            --timeout 10m

      - name: Run smoke tests
        run: |
          kubectl rollout status deployment/nidaw-backend -n staging --timeout=300s
          # Add smoke test script here

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name nidaw-production --region ${{ secrets.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install nidaw-backend ./helm/nidaw \
            --namespace production \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set global.environment=production \
            --values ./helm/nidaw/values-prod.yaml \
            --wait \
            --timeout 10m

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Backend deployed successfully to production"
          # Add Slack/Discord notification here