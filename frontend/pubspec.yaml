name: nidaw_app
description: NIDAW - AI-Native Mobility Super-App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  # §4.3 Localization (Amharic / Oromo). gen-l10n reads lib/l10n/*.arb via
  # l10n.yaml; intl is already pinned below for message formatting.
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # Dependency Injection
  get_it: ^7.6.4

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  web_socket_channel: ^2.4.0

  # Maps & Location
  flutter_map: ^6.1.0
  # NOTE(Phase3 toolchain): ^6.1.3 never existed on pub.dev (published versions
  # jump 1.4.0 -> 8.1.0), which made dependency resolution fail on every clean
  # checkout. The package is not imported anywhere in lib/ or test/, so pinning
  # to the real published 1.4.x line (compatible with flutter_map ^6.1.0)
  # restores resolvability without any behavior change.
  flutter_map_marker_cluster: ^1.4.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Connectivity
  connectivity_plus: ^5.0.2

  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.65.0
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  share_plus: ^7.2.1

  # §3.4 Receipt PDF: generated client-side from the ride DTO and saved via
  # path_provider; printing provides the PdfDoc -> bytes pipeline.
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9

  # Notifications (§1.4): FCM + local notification display for backgrounded
  # pushes, and package_info_plus to stamp app_version on token registration.
  flutter_local_notifications: ^16.3.2
  package_info_plus: ^5.0.1

  # AR & Voice
  ar_flutter_plugin: ^0.7.3
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.5

  # §4.1 AR navigation uses Vector3/Vector4 transforms directly (flutter_map
  # and flutter depend on vector_math transitively, but Global Rule 3 requires
  # every imported package to be explicitly declared before its importer ships).
  vector_math: ^2.1.2

  # Image
  image_picker: ^1.0.4

# NOTE(Phase3 toolchain): ar_flutter_plugin's newest published release (0.7.3)
# pins permission_handler ^10.x, which is unsatisfiable alongside this app's
# permission_handler ^11.1.0 — `flutter pub get` failed version solving on
# every clean checkout. The AR page code only uses the stable public API
# (ARController/handlers/node types), identical across permission_handler
# majors, so the transitive pin is overridden to keep the feature intact.
dependency_overrides:
  permission_handler: ^11.1.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  mockito: ^5.4.3
  bloc_test: ^9.1.5

flutter:
  # §4.3 Localization: required so the synthetic `package:flutter_gen`
  # localizations package (AppLocalizations delegates in lib/main.dart) is
  # generated during pub get / build. Without this flag `flutter pub get`
  # fails localization generation and no .dart_tool/package_config.json is
  # produced, blocking dart analyze and flutter test entirely.
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/config/feature-flags/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700