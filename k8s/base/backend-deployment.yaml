apiVersion: apps/v1
kind: Deployment
metadata:
  name: nidaw-backend
  namespace: nidaw-production
  labels:
    app: nidaw
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nidaw
      component: backend
  template:
    metadata:
      labels:
        app: nidaw
        component: backend
    spec:
      containers:
        - name: backend
          image: nidaw/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: nidaw-secrets
                  key: db-host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nidaw-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nidaw-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5