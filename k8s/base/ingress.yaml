apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nidaw-ingress
  namespace: nidaw-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.nidaw.com
        - app.nidaw.com
      secretName: nidaw-tls
  rules:
    - host: api.nidaw.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nidaw-backend
                port:
                  number: 80
    - host: app.nidaw.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nidaw-frontend
                port:
                  number: 80