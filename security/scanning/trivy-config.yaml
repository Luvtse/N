
# ============================================================================
# NIDAW Trivy Configuration
# Container and filesystem vulnerability scanning
# ============================================================================

# ----------------------------------------------------------------------------
# SEVERITY FILTERS
# ----------------------------------------------------------------------------
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  # - LOW  # Uncomment to include LOW severity
  # - UNKNOWN  # Uncomment to include UNKNOWN severity

# ----------------------------------------------------------------------------
# VULNERABILITY TYPES
# ----------------------------------------------------------------------------
vulnerability-types:
  - os  # Operating system packages
  - library  # Application libraries
  # - config  # Infrastructure as Code (uncomment if needed)
  # - secret  # Secret scanning (handled by gitleaks)

# ----------------------------------------------------------------------------
# SCAN TARGETS
# ----------------------------------------------------------------------------
scan:
  # Container images
  image:
    enabled: true
    targets:
      - nidaw/backend
      - nidaw/frontend
      - nidaw/driver-app
      - nidaw/ml
      - nidaw/kong-gateway
    
    # Ignore unfixed vulnerabilities
    ignore-unfixed: false
    
    # Timeout for image scanning
    timeout: 10m
  
  # Filesystem scanning
  filesystem:
    enabled: true
    paths:
      - backend/
      - frontend/
      - driver-app/
      - ml/
      - infrastructure/
    
    # Skip directories
    skip-dirs:
      - node_modules
      - vendor
      - .git
      - .venv
      - venv
      - __pycache__
      - build
      - dist
      - .cache
      - coverage
    
    # Skip files
    skip-files:
      - "*.log"
      - "*.tmp"
      - "*.bak"
      - "*.swp"
      - ".DS_Store"
      - "Thumbs.db"
  
  # Repository scanning
  repository:
    enabled: true
    targets:
      - .
    
    # Branch to scan
    branch: main

# ----------------------------------------------------------------------------
# IGNORE RULES
# ----------------------------------------------------------------------------
ignore:
  # Ignore specific vulnerabilities
  vulnerabilities:
    # Example: Ignore CVE-2021-44228 (Log4j) if not applicable
    # - CVE-2021-44228
    
    # Ignore vulnerabilities with no fix available
    # - unfixed
  
  # Ignore specific packages
  packages:
    # Example: Ignore specific package versions
    # - name: "lodash"
    #   version: "4.17.20"
  
  # Ignore by policy
  policy:
    # Ignore vulnerabilities older than X days
    # max-age: 90d
    
    # Ignore vulnerabilities with specific status
    # status:
    #   - not-affected
    #   - fixed

# ----------------------------------------------------------------------------
# OUTPUT CONFIGURATION
# ----------------------------------------------------------------------------
output:
  # Output formats
  formats:
    - table  # Human-readable table
    - json   # JSON format
    - sarif  # SARIF format for GitHub
    # - template  # Custom template
  
  # Output file
  file: security-reports/trivy-report.json
  
  # Template (if using template format)
  # template: "@/contrib/gitlab.tpl"
  
  # List all packages
  list-all-pkgs: false

# ----------------------------------------------------------------------------
# DATABASE CONFIGURATION
# ----------------------------------------------------------------------------
db:
  # Database repository
  repository: ghcr.io/aquasecurity/trivy-db
  
  # Skip database update
  skip-update: false
  
  # Database cache directory
  cache-dir: .cache/trivy
  
  # Download database only
  download-db-only: false
  
  # Java database repository
  java-db-repository: ghcr.io/aquasecurity/trivy-java-db

# ----------------------------------------------------------------------------
# CACHE CONFIGURATION
# ----------------------------------------------------------------------------
cache:
  # Clear cache
  clear: false
  
  # Cache directory
  dir: .cache/trivy

# ----------------------------------------------------------------------------
# MISCONFIGURATION SCANNING
# ----------------------------------------------------------------------------
misconfiguration:
  enabled: true
  
  # Policies
  policy:
    - config/policies
  
  # Data
  data:
    - config/data
  
  # Namespaces
  namespaces: []
  
  # Skip directories
  skip-dirs:
    - tests
    - examples

# ----------------------------------------------------------------------------
# SECRET SCANNING (Supplementary to gitleaks)
# ----------------------------------------------------------------------------
secret:
  enabled: false  # Primary secret scanning handled by gitleaks
  
  # Config file
  # config: config/secret-config.yaml

# ----------------------------------------------------------------------------
# LICENSE SCANNING
# ----------------------------------------------------------------------------
license:
  enabled: true
  
  # Confidence level
  confidence: 0.9
  
  # Forbidden licenses
  forbidden:
    - AGPL-3.0
    - GPL-3.0
    # Add other forbidden licenses
  
  # Permitted licenses
  permitted:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC

# ----------------------------------------------------------------------------
# INTEGRATION CONFIGURATION
# ----------------------------------------------------------------------------
integration:
  # GitHub Actions
  github:
    enabled: true
    
    # Upload SARIF results
    upload-sarif: true
    
    # SARIF file
    sarif-file: security-reports/trivy-results.sarif
  
  # GitLab
  gitlab:
    enabled: false
    
    # Dependency scanning report
    dependency-scanning-report: security-reports/gl-dependency-scanning-report.json
  
  # Jira
  jira:
    enabled: false
    
    # Jira project
    # project: SEC
    
    # Issue type
    # issue-type: Bug

# ----------------------------------------------------------------------------
# NOTIFICATION CONFIGURATION
# ----------------------------------------------------------------------------
notification:
  # Slack
  slack:
    enabled: true
    
    # Webhook URL (from environment variable)
    webhook-url: ${SLACK_WEBHOOK_URL}
    
    # Channel
    channel: "#security-alerts"
    
    # Severity threshold
    severity-threshold: HIGH
  
  # Email
  email:
    enabled: false
    
    # Recipients
    # recipients:
    #   - security@nidaw.com
    
    # Severity threshold
    # severity-threshold: CRITICAL

# ----------------------------------------------------------------------------
# PERFORMANCE CONFIGURATION
# ----------------------------------------------------------------------------
performance:
  # Number of goroutines
  goroutines: 4
  
  # Timeout
  timeout: 30m
  
  # Offline scan
  offline-scan: false

# ----------------------------------------------------------------------------
# EXIT CODE CONFIGURATION
# ----------------------------------------------------------------------------
exit-code:
  # Exit code on vulnerability detection
  vulnerability: 1
  
  # Exit code on misconfiguration
  misconfiguration: 1
  
  # Exit code on secret detection
  secret: 1

# ----------------------------------------------------------------------------
# DEBUG CONFIGURATION
# ----------------------------------------------------------------------------
debug:
  # Enable debug mode
  enabled: false
  
  # Log level
  log-level: info