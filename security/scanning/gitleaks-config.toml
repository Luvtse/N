# ============================================================================
# NIDAW Gitleaks Configuration
# Secret detection for code repositories
# ============================================================================

# ----------------------------------------------------------------------------
# TITLE AND DESCRIPTION
# ----------------------------------------------------------------------------
title = "NIDAW Gitleaks Configuration"

# ----------------------------------------------------------------------------
# ALLOWLIST (False Positives)
# ----------------------------------------------------------------------------
[allowlist]
description = "Global Allowlist"
paths = [
    # Test files
    '''(.*?)(test|spec|mock|fixture)s?\.(go|js|ts|py|rb|java|php)$''',
    '''test[_-]?data''',
    '''tests?/''',
    
    # Documentation
    '''(.*?)(md|rst|txt)$''',
    '''docs/''',
    '''documentation/''',
    
    # Dependencies
    '''(go\.mod|go\.sum)$''',
    '''(package|yarn|pnpm)-lock\.(json|yaml)$''',
    '''requirements\.txt$''',
    '''Pipfile\.lock$''',
    '''Gemfile\.lock$''',
    '''composer\.lock$''',
    
    # Build artifacts
    '''(build|dist|out|target|\.cache)/''',
    '''\.(exe|dll|so|dylib|a|o|obj|class|jar|war|ear)$''',
    
    # Version control
    '''\.git/''',
    '''\.svn/''',
    '''\.hg/''',
    
    # IDE and editor files
    '''\.(idea|vscode|vs|eclipse|atom|sublime)/''',
    '''\.(iml|ipr|iws|suo|ncb|sdf|opensdf|cachefile)$''',
    
    # OS files
    '''\.DS_Store$''',
    '''Thumbs\.db$''',
    '''desktop\.ini$''',
    
    # Logs
    '''\.(log|out|err)$''',
    '''logs/''',
    
    # Coverage
    '''coverage/''',
    '''\.coverage$''',
    
    # Node modules
    '''node_modules/''',
    
    # Python virtual environments
    '''(venv|\.venv|env|\.env)/''',
    
    # Terraform state
    '''terraform\.tfstate(\.backup)?$''',
    '''\.terraform/''',
    
    # Kubernetes
    '''kubeconfig''',
    '''\.kube/''',
    
    # Docker
    '''\.docker/''',
    
    # NIDAW specific
    '''\.env\.example$''',
    '''\.env\.local$''',
    '''config/.*\.example$''',
]

regexes = [
    # Example values in documentation
    '''example[_-]?(key|token|secret|password)''',
    '''placeholder''',
    '''xxx+''',
    '''test[_-]?(key|token|secret|password)''',
    '''dummy''',
    '''fake''',
    '''sample''',
    
    # Hashes that look like secrets but aren't
    '''[a-f0-9]{64}''',  # SHA-256 hashes
    '''[a-f0-9]{40}''',  # SHA-1 hashes
]

# ----------------------------------------------------------------------------
# RULES
# ----------------------------------------------------------------------------

# AWS Access Key ID
[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(?i)(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "AWS"]

# AWS Secret Access Key
[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws_(.{0,20})?['\"]?[0-9a-zA-Z/+]{40}['\"]?'''
tags = ["key", "AWS"]

# AWS MWS Auth Token
[[rules]]
id = "aws-mws-auth-token"
description = "AWS MWS Auth Token"
regex = '''amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["token", "AWS"]

# GitHub Personal Access Token
[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["token", "GitHub"]

# GitHub OAuth Access Token
[[rules]]
id = "github-oauth"
description = "GitHub OAuth Access Token"
regex = '''gho_[0-9a-zA-Z]{36}'''
tags = ["token", "GitHub"]

# GitHub App Token
[[rules]]
id = "github-app-token"
description = "GitHub App Token"
regex = '''(ghu|ghs)_[0-9a-zA-Z]{36}'''
tags = ["token", "GitHub"]

# GitHub Refresh Token
[[rules]]
id = "github-refresh-token"
description = "GitHub Refresh Token"
regex = '''ghr_[0-9a-zA-Z]{76}'''
tags = ["token", "GitHub"]

# GitLab Personal Access Token
[[rules]]
id = "gitlab-pat"
description = "GitLab Personal Access Token"
regex = '''glpat-[0-9a-zA-Z\\-\\_]{20}'''
tags = ["token", "GitLab"]

# Slack Token
[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-([0-9a-zA-Z]{10,48})?'''
tags = ["token", "Slack"]

# Slack Webhook
[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8}/[a-zA-Z0-9_]{24}'''
tags = ["webhook", "Slack"]

# Stripe API Key
[[rules]]
id = "stripe-api-key"
description = "Stripe API Key"
regex = '''(?i)(sk|pk)_(test|live)_[0-9a-z]{10,32}'''
tags = ["key", "Stripe"]

# Google API Key
[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\\-_]{35}'''
tags = ["key", "Google"]

# Google OAuth Token
[[rules]]
id = "google-oauth"
description = "Google OAuth Token"
regex = '''[0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com'''
tags = ["token", "Google"]

# Heroku API Key
[[rules]]
id = "heroku-api-key"
description = "Heroku API Key"
regex = '''(?i)heroku(.{0,20})?['\"]?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}['\"]?'''
tags = ["key", "Heroku"]

# Twilio API Key
[[rules]]
id = "twilio-api-key"
description = "Twilio API Key"
regex = '''SK[0-9a-fA-F]{32}'''
tags = ["key", "Twilio"]

# SendGrid API Key
[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[0-9A-Za-z\-_]{22}\.[0-9A-Za-z\-_]{43}'''
tags = ["key", "SendGrid"]

# Mailgun API Key
[[rules]]
id = "mailgun-api-key"
description = "Mailgun API Key"
regex = '''key-[0-9a-zA-Z]{32}'''
tags = ["key", "Mailgun"]

# JWT Token
[[rules]]
id = "jwt-token"
description = "JSON Web Token"
regex = '''eyJ[A-Za-z0-9-_=]+\.eyJ[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*?'''
tags = ["token", "JWT"]

# Private Key
[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN ((EC|PGP|DSA|RSA|OPENSSH) )?PRIVATE KEY( BLOCK)?-----'''
tags = ["key", "private"]

# Generic Secret
[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(password|passwd|pwd|secret|token|api_?key|apikey|access_?key|auth|credential)(.{0,20})?['\"]?[0-9a-zA-Z_\-\/\+\.=]{8,}['\"]?'''
tags = ["secret", "generic"]

# High Entropy String (Base64)
[[rules]]
id = "high-entropy-base64"
description = "High Entropy Base64 String"
regex = '''(?i)(key|token|secret|password|auth|credential)(.{0,20})?['\"]?[A-Za-z0-9+/]{50,}={0,2}['\"]?'''
tags = ["secret", "entropy"]

# High Entropy String (Hex)
[[rules]]
id = "high-entropy-hex"
description = "High Entropy Hex String"
regex = '''(?i)(key|token|secret|password|auth|credential)(.{0,20})?['\"]?[0-9a-f]{40,}['\"]?'''
tags = ["secret", "entropy"]

# NIDAW-specific JWT Secret
[[rules]]
id = "nidaw-jwt-secret"
description = "NIDAW JWT Secret"
regex = '''(?i)nidaw(.{0,20})?jwt(.{0,20})?secret(.{0,20})?['\"]?[0-9a-zA-Z_\-\/\+\.]{32,}['\"]?'''
tags = ["secret", "NIDAW"]

# NIDAW-specific API Key
[[rules]]
id = "nidaw-api-key"
description = "NIDAW API Key"
regex = '''(?i)nidaw(.{0,20})?(api|access)?(.{0,20})?key(.{0,20})?['\"]?[0-9a-zA-Z_\-\/\+\.]{32,}['\"]?'''
tags = ["key", "NIDAW"]

# Database Connection String
[[rules]]
id = "database-connection"
description = "Database Connection String"
regex = '''(?i)(postgres|mysql|mongodb|redis)://[^:\s]+:[^@\s]+@[^\s]+'''
tags = ["connection", "database"]

# Connection String with Password
[[rules]]
id = "connection-string-password"
description = "Connection String with Password"
regex = '''(?i)(host|server|database|dsn)(.{0,20})?(password|pwd)(.{0,20})?['\"]?[^'\"\s]{8,}['\"]?'''
tags = ["connection", "password"]

# ----------------------------------------------------------------------------
# EXTEND RULES
# ----------------------------------------------------------------------------
# You can extend rules with additional patterns
# [[rules.extend]]
# id = "custom-rule"
# description = "Custom Rule"
# regex = '''custom-pattern'''

# ----------------------------------------------------------------------------
# REPORT CONFIGURATION
# ----------------------------------------------------------------------------
[report]
# Output format: json, csv, sarif
format = "sarif"

# Output file
output = "security-reports/gitleaks-report.sarif"

# ----------------------------------------------------------------------------
# SCAN CONFIGURATION
# ----------------------------------------------------------------------------
[scan]
# Scan depth (number of commits)
# depth = 0  # 0 = all commits

# Scan untracked files
untracked = true

# Scan submodules
submodules = false

# ----------------------------------------------------------------------------
# EXIT CODE
# ----------------------------------------------------------------------------
[exit-code]
# Exit code when secrets are found
secret-found = 1

# Exit code when no secrets are found
no-secret-found = 0