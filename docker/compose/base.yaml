# ============================================================================
# NIDAW Base Services - Core Infrastructure
# PostgreSQL, Redis, Kafka, MinIO, Schema Registry
# ============================================================================

version: '3.9'

x-common-env: &common-env
  TZ: UTC
  ENVIRONMENT: ${ENVIRONMENT:-development}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

services:
  # ==========================================================================
  # POSTGRESQL - Primary Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: nidaw-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${DB_USER:-nidaw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nidaw_dev}
      POSTGRES_DB: ${DB_NAME:-nidaw}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nidaw} -d ${DB_NAME:-nidaw}"]
    networks:
      - nidaw-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # TIMESCALEDB - Time-Series Database (GPS, Metrics)
  # ==========================================================================
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: nidaw-timescale
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${DB_USER:-nidaw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nidaw_dev}
      POSTGRES_DB: ${TIMESCALE_DB:-nidaw_timeseries}
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nidaw}"]
    networks:
      - nidaw-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ==========================================================================
  # REDIS - Cache & Session Store
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: nidaw-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - nidaw-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  # Redis Commander (UI for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nidaw-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0"
      HTTP_USER: ${REDIS_UI_USER:-admin}
      HTTP_PASSWORD: ${REDIS_UI_PASSWORD:-admin}
    ports:
      - "${REDIS_UI_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nidaw-network
    profiles:
      - tools

  # ==========================================================================
  # KAFKA - Event Streaming Platform
  # ==========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nidaw-kafka
    restart: unless-stopped
    environment:
      <<: *common-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:-1073741824}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
    ports:
      - "${KAFKA_PORT:-29092}:29092"
      - "9092:9092"
      - "9999:9999"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ../config/kafka/server.properties:/etc/kafka/server.properties:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    networks:
      - nidaw-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ==========================================================================
  # SCHEMA REGISTRY - Kafka Schema Management
  # ==========================================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: nidaw-schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8082}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
    networks:
      - nidaw-network

  # ==========================================================================
  # MINIO - S3-Compatible Object Storage
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: nidaw-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    networks:
      - nidaw-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ==========================================================================
  # KAFKA UI - Management Interface
  # ==========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nidaw-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: nidaw-${ENVIRONMENT:-development}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: nidaw-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8083}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - nidaw-network
    profiles:
      - tools

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  timescale_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  nidaw-network:
    driver: bridge
    name: nidaw-network
    ipam:
      config:
        - subnet: 172.28.0.0/16