# ============================================================================
# NIDAW Pre-commit Hooks Configuration
# ============================================================================
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# ============================================================================

repos:
  # ----------------------------------------------------------------------------
  # GENERAL HOOKS
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/|^legal/
      - id: end-of-file-fixer
        exclude: ^docs/|^legal/
      - id: check-yaml
        exclude: ^helm/|^k8s/
      - id: check-json
        exclude: ^helm/|^k8s/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'production']
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ----------------------------------------------------------------------------
  # SECRET DETECTION (CRITICAL)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        args: ['--config', 'security/scanning/gitleaks-config.toml']

  # ----------------------------------------------------------------------------
  # GO (Backend)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^backend/
      - id: go-vet
        files: ^backend/
      - id: go-imports
        files: ^backend/
      - id: go-cyclo
        files: ^backend/
        args: ['-over', '15']
      - id: validate-toml
      - id: no-go-testing

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.55.2
    hooks:
      - id: golangci-lint
        files: ^backend/
        args: ['--config', 'backend/.golangci.yml']

  # ----------------------------------------------------------------------------
  # FLUTTER / DART (Frontend)
  # ----------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$
        types: [dart]
      
      - id: flutter-analyze
        name: flutter analyze
        entry: bash -c 'cd frontend && flutter analyze'
        language: system
        files: ^frontend/.*\.dart$
        pass_filenames: false
      
      - id: flutter-test
        name: flutter test
        entry: bash -c 'cd frontend && flutter test'
        language: system
        files: ^frontend/.*\.dart$
        pass_filenames: false
        stages: [pre-push]

  # ----------------------------------------------------------------------------
  # PYTHON (ML/AI)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        files: ^ml/
        args: ['--line-length=100']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^ml/
        args: ['--profile', 'black']

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        files: ^ml/
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        files: ^ml/
        additional_dependencies: ['types-requests', 'types-PyYAML']

  # ----------------------------------------------------------------------------
  # TERRAFORM
  # ----------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.5
    hooks:
      - id: terraform_fmt
        files: ^infrastructure/
      - id: terraform_validate
        files: ^infrastructure/
      - id: terraform_docs
        files: ^infrastructure/
        args: ['--hook-config=--path-to-file=README.md', '--hook-config=--add-to-existing-file=true']
      - id: terraform_tflint
        files: ^infrastructure/
      - id: terraform_tfsec
        files: ^infrastructure/
        args: ['--soft-fail']

  # ----------------------------------------------------------------------------
  # DOCKER
  # ----------------------------------------------------------------------------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        files: Dockerfile$
        args: ['--ignore', 'DL3008', '--ignore', 'DL3003']

  # ----------------------------------------------------------------------------
  # YAML / JSON
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: ^helm/|^k8s/|^legal/|^docs/

  # ----------------------------------------------------------------------------
  # SHELL SCRIPTS
  # ----------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.sh$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-4
    hooks:
      - id: shfmt
        files: \.sh$

  # ----------------------------------------------------------------------------
  # SOLIDITY (Blockchain)
  # ----------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: solhint
        name: solhint
        entry: bash -c 'cd blockchain && npx solhint "contracts/**/*.sol"'
        language: system
        files: ^blockchain/contracts/.*\.sol$
        pass_filenames: false

  # ----------------------------------------------------------------------------
  # SECURITY SCANNING
  # ----------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        files: ^ml/
        args: ['-c', 'ml/.bandit.yml']
        additional_dependencies: ['bandit[yaml]']

  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.0
    hooks:
      - id: python-safety-dependencies-check
        files: ^ml/requirements\.txt$

  # ----------------------------------------------------------------------------
  # SPELLING
  # ----------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        exclude: ^(legal/|docs/api/|go\.sum|pubspec\.lock|package-lock\.json)
        args: ['--ignore-words', '.codespell-ignore']

# ============================================================================
# EXCLUSION PATTERNS
# ============================================================================
exclude: |
  (?x)^(
    .*\.(lock|sum|pem|key|crt|p12|jks)|
    \.git/.*|
    node_modules/.*|
    vendor/.*|
    \.venv/.*|
    venv/.*|
    build/.*|
    dist/.*|
    coverage/.*|
    \.terraform/.*|
    .*\.tfstate.*|
    helm/charts/.*\.tgz
  )$