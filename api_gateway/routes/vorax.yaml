# ============================================================================
# VORAX Routes - Food Delivery Service
# ============================================================================

# --------------------------------------------------------------------------
# RESTAURANT ROUTES (PUBLIC)
# --------------------------------------------------------------------------

- name: vorax-restaurant-list
  service: vorax-service
  protocols:
    - https
    - http
  paths:
    - /api/v1/vorax/restaurants
  methods:
    - GET
  strip_path: false
  preserve_host: true
  tags:
    - vorax
    - restaurants
    - public
  plugins:
    - name: nidaw-rate-limiting
      config:
        enable_tier_limiting: false
    - name: proxy-cache
      config:
        response_code:
          - 200
        request_method:
          - GET
        content_type:
          - application/json
        cache_ttl: 120
        strategy: memory
        memory:
          dictionary_name: kong_db_cache
    - name: request-transformer
      config:
        add:
          headers:
            - "X-Service: vorax"
            - "X-Action: list_restaurants"

- name: vorax-restaurant-detail
  service: vorax-service
  protocols:
    - https
    - http
  paths:
    - ~/api/v1/vorax/restaurants/[0-9a-f-]+$
  methods:
    - GET
  strip_path: false
  preserve_host: true
  tags:
    - vorax
    - restaurants
    - public
  plugins:
    - name: proxy-cache
      config:
        response_code:
          - 200
        request_method:
          - GET
        cache_ttl: 300
        strategy: memory

- name: vorax-restaurant-menu
  service: vorax-service
  protocols:
    - https
    - http
  paths:
    - ~/api/v1/vorax/restaurants/[0-9a-f-]+/menu$
  methods:
    - GET
  strip_path: false
  preserve_host: true
  tags:
    - vorax
    - restaurants
    - public
  plugins:
    - name: proxy-cache
      config:
        response_code:
          - 200
        request_method:
          - GET
        cache_ttl: 600
        strategy: memory

# --------------------------------------------------------------------------
# ORDER ROUTES (AUTHENTICATED)
# --------------------------------------------------------------------------

- name: vorax-order-create
  service: vorax-service
  protocols:
    - https
  paths:
    - /api/v1/vorax/orders
  methods:
    - POST
  strip_path: false
  preserve_host: true
  tags:
    - vorax
    - orders
    - authenticated
  plugins:
    - name: nidaw-jwt-auth
      config:
        required_roles:
          - rider
          - corporate
          - admin
    - name: nidaw-rate-limiting
      config:
        enable_tier_limiting: true
        enable_burst: true
    - name: request-transformer
      config:
        add:
          headers:
            - "X-Service: vorax"
            - "X-Action: create_order"
    - name: request-size-limiting
      config:
        allowed_payload_size: 2
        size_unit: megabytes

- name: vorax-order-list
  service: vorax-service
  protocols:
    - https
  paths:
    - /api/v1/vorax/orders
  methods:
    - GET
  strip_path: false
  preserve_host: true
  tags:
