# LOCATION TRACKING
# --------------------------------------------------------------------------

- name: nidus-location-update
  service: nidus-service
  protocols:
    - https
  paths:
    - /api/v1/nidus/location/update
  methods:
    - POST
  strip_path: false
  preserve_host: true
  tags:
    - nidus
    - location
    - authenticated
  plugins:
    - name: nidaw-jwt-auth
      config:
        required_roles:
          - driver
    - name: nidaw-rate-limiting
      config:
        enable_tier_limiting: true
        enable_burst: true
    - name: request-size-limiting
      config:
        allowed_payload_size: 1
        size_unit: kilobytes

