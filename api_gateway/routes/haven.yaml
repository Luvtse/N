# ============================================================================
# HAVEN Routes - Hotel Booking Service
# ============================================================================

# --------------------------------------------------------------------------
# HOTEL SEARCH (PUBLIC)
# --------------------------------------------------------------------------

- name: haven-hotel-search
  service: haven-service
  protocols:
    - https
    - http
  paths:
    - /api/v1/haven/hotels
  methods:
    - GET
  strip_path: false
  preserve_host: true
  tags:
    - haven
    - hotels
    - public
  plugins:
    - name: nidaw-rate-limiting
      config:
        enable_tier_limiting: false
    - name: proxy-cache
      config:
        response_code:
          - 200
        request_method:
          - GET
        content_type:
          - application/json
        cache_ttl: 300
        strategy: memory
        memory:
          dictionary_name: kong_db_cache
    - name: request-transformer
      config:
        add:
          headers:
            - "X-Service: haven"
            - "X-Action: search_hotels"

- name: haven-hotel-detail
  service: haven-service
  protocols:
    - https
    - http
  paths:
    - ~/api/v1/haven/hotels/[0-9a-f-]+$
  methods:
    - GET
  strip_path: false
  preserve_host: true
  tags:
    - haven
    - hotels
    - public
  plugins:
    - name: nidaw-rate-limiting
      config:
        enable_tier_limiting: false
    - name: proxy-cache
      config:
        response_code:
          - 200
        request_method:
          - GET
        content_type:
          - application/json
        cache_ttl: 600
        strategy: memory
        memory:
          dictionary_name: kong_db_cache

# --------------------------------------------------------------------------
# BOOKING ROUTES (AUTHENTICATED)
# --------------------------------------------------------------------------

- name: haven-booking-create
  service: haven-service
  protocols:
    - https
  paths:
    - /api/v1/haven/bookings
  methods:
    - POST
  strip_path: false
  preserve_host: true
  tags:
    - haven
    - bookings
    - authenticated
  plugins:
    - name: nidaw-jwt-auth
      config:
        required_roles:
