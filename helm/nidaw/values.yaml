# Global settings
global:
  environment: development
  region: us-east-1

# Backend configuration
backend:
  replicaCount: 3
  
  image:
    repository: nidaw/backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    DATABASE_URL: ""
    KAFKA_BROKERS: ""
    REDIS_URL: ""
    STRIPE_KEY: ""
  
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# Frontend configuration
frontend:
  replicaCount: 2
  
  image:
    repository: nidaw/frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  
  hosts:
    - host: api.nidaw.com
      paths:
        - path: /
          pathType: Prefix
    - host: app.nidaw.com
      paths:
        - path: /
          pathType: Prefix
  
  tls:
    - secretName: nidaw-tls
      hosts:
        - api.nidaw.com
        - app.nidaw.com

# Database configuration
database:
  host: ""
  port: 5432
  name: nidaw
  username: nidaw_admin
  password: ""

# Kafka configuration
kafka:
  brokers: ""
  topicPrefix: nidaw

# Redis configuration
redis:
  host: ""
  port: 6379
  password: ""

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s