{{/*
============================================================================
NIDAW Service Account
============================================================================
*/}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nidaw.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nidaw.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---

# Role for accessing secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nidaw.fullname" . }}-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nidaw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "nidaw.backend.fullname" . }}-secrets
    verbs: ["get", "watch"]

---

# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nidaw.fullname" . }}-secret-reader-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nidaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nidaw.fullname" . }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "nidaw.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}