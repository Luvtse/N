{{/*
============================================================================
NIDAW Frontend Deployment
============================================================================
*/}}

{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nidaw.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nidaw.frontend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      {{- include "nidaw.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nidaw.frontend.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "nidaw.configMapChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nidaw.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      {{- if gt (int .Values.frontend.replicaCount) 1 }}
      affinity:
        {{- include "nidaw.antiAffinity" (dict "component" "frontend" "fullname" (include "nidaw.frontend.fullname" .)) | nindent 8 }}
      {{- end }}
      
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
              protocol: TCP
          
          env:
            {{- include "nidaw.envVars" .Values.frontend.env | nindent 12 }}
          
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          {{- with .Values.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 200Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
      
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}