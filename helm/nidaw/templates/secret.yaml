{{/*
============================================================================
NIDAW Secret
Note: In production, use External Secrets Operator or Sealed Secrets
============================================================================
*/}}

{{- if not .Values.backend.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nidaw.backend.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nidaw.backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.backend.secrets.jwtSecret }}
  jwt-secret: {{ .Values.backend.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.backend.secrets.dbPassword }}
  db-password: {{ .Values.backend.secrets.dbPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.backend.secrets.stripeApiKey }}
  stripe-api-key: {{ .Values.backend.secrets.stripeApiKey | b64enc | quote }}
  {{- end }}
{{- end }}