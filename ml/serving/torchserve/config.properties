# ============================================================================
# NIDAW TorchServe Configuration
# Production-optimized model serving
# ============================================================================

# ----------------------------------------------------------------------------
# INFERENCE WORKERS
# ----------------------------------------------------------------------------
# Number of worker threads per model
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082

# Worker configuration
default_workers_per_model=4
job_queue_size=1000

# ----------------------------------------------------------------------------
# MODEL STORE
# ----------------------------------------------------------------------------
model_store=/models
load_models=all

# ----------------------------------------------------------------------------
# PERFORMANCE TUNING
# ----------------------------------------------------------------------------
# Batch inference
batch_size=8
max_batch_delay=100

# Request timeout
max_request_size=10485760
max_response_size=10485760

# Worker timeout
unregister_model_timeout=120

# ----------------------------------------------------------------------------
# CORS CONFIGURATION
# ----------------------------------------------------------------------------
cors_allowed_origin=*
cors_allow_methods=GET, POST, PUT, DELETE, OPTIONS
cors_allow_headers=Authorization, Content-Type

# ----------------------------------------------------------------------------
# METRICS & MONITORING
# ----------------------------------------------------------------------------
metrics_format=prometheus
metrics_mode=prometheus

# Enable detailed metrics
enable_model_metrics=true
enable_env_metrics=true

# ----------------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------------
# Log level: DEBUG, INFO, WARN, ERROR
log_level=INFO

# Log format
log_format=json

# ----------------------------------------------------------------------------
# SECURITY
# ----------------------------------------------------------------------------
# Enable SSL/TLS
# ssl_cert_file=/certs/server.crt
# ssl_key_file=/certs/server.key

# ----------------------------------------------------------------------------
# MODEL SPECIFIC CONFIGURATIONS
# ----------------------------------------------------------------------------
# ETA Prediction Model
models.eta_prediction.default_workers=4
models.eta_prediction.batch_size=16
models.eta_prediction.max_batch_delay=50

# Demand Forecasting Model
models.demand_forecasting.default_workers=2
models.demand_forecasting.batch_size=8
models.demand_forecasting.max_batch_delay=100

# Dynamic Pricing Model
models.dynamic_pricing.default_workers=3
models.dynamic_pricing.batch_size=12
models.dynamic_pricing.max_batch_delay=75

# Driver Churn Model
models.driver_churn.default_workers=2
models.driver_churn.batch_size=32
models.driver_churn.max_batch_delay=200

# Restaurant Recommendation
models.restaurant_recommendation.default_workers=4
models.restaurant_recommendation.batch_size=16
models.restaurant_recommendation.max_batch_delay=50

# ----------------------------------------------------------------------------
# RESOURCE LIMITS
# ----------------------------------------------------------------------------
# Memory limits per worker
jvm_memory_limit=2g
cpu_limit=4

# ----------------------------------------------------------------------------
# HEALTH CHECK
# ----------------------------------------------------------------------------
health_check_interval=30
health_check_timeout=5

# ----------------------------------------------------------------------------
# GRPC CONFIGURATION (Optional)
# ----------------------------------------------------------------------------
# grpc_inference_port=7070
# grpc_management_port=7071

# ----------------------------------------------------------------------------
# FEATURE STORE INTEGRATION
# ----------------------------------------------------------------------------
feature_store_url=http://feast:6566
feature_cache_ttl=300

# ----------------------------------------------------------------------------
# REDIS CACHE
# ----------------------------------------------------------------------------
redis_host=redis
redis_port=6379
redis_db=2
redis_password=

# ----------------------------------------------------------------------------
# MODEL VERSIONING
# ----------------------------------------------------------------------------
enable_model_versioning=true
model_version_header=X-Model-Version

# ----------------------------------------------------------------------------
# CIRCUIT BREAKER
# ----------------------------------------------------------------------------
circuit_breaker_enabled=true
circuit_breaker_threshold=0.5
circuit_breaker_timeout=30000